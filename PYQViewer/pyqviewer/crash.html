<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>PYQViewer — Application error</title><style>:root{--bg:#030408;--muted:#737c8e;--text:#f5f7fb;--line:rgba(255,255,255,.1);--accent:#8b5cf6;--ease:cubic-bezier(.16,1,.3,1)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif}body{display:flex;align-items:center;justify-content:center;padding:2rem;overflow:hidden}.shell{width:min(680px,100%);text-align:center}.brand{display:inline-flex;align-items:center;gap:.65rem;color:#fff;font-weight:900;letter-spacing:-.03em;margin-bottom:2.2rem}.brand img{width:30px;height:30px}.code{font-size:.68rem;text-transform:uppercase;letter-spacing:.15em;color:#6e778a;margin-bottom:1.4rem}.heart{font-size:4.8rem;line-height:1;display:inline-block;filter:drop-shadow(0 12px 26px rgba(139,92,246,.25));animation:heartBeat 3.4s var(--ease) infinite}.heart::selection{background:transparent}.title{font-size:clamp(1.8rem,5vw,3rem);font-weight:950;letter-spacing:-.05em;margin-top:1.3rem}.message{max-width:520px;margin:1rem auto 0;color:#a8b0bf;line-height:1.7;font-size:.9rem}.status{display:inline-flex;align-items:center;gap:.45rem;margin-top:1.6rem;padding:.55rem .75rem;border:1px solid var(--line);border-radius:999px;color:#bfc6d4;background:rgba(255,255,255,.03);font-size:.72rem}.dot{width:7px;height:7px;border-radius:50%;background:#ff5f56;box-shadow:0 0 14px rgba(255,95,86,.5)}.foot{margin-top:2.2rem;color:#5f6777;font-size:.66rem}@keyframes heartBeat{0%,12%,100%{transform:scale(1)}4%{transform:scale(1.075)}8%{transform:scale(1.018)}58%{transform:scale(1)}62%{transform:scale(1.045)}66%{transform:scale(1.012)}}@media(prefers-reduced-motion:reduce){.heart{animation:none}}</style></head><body><main class="shell"><div class="brand"><img src="/logo.svg" alt="">PYQViewer</div><div class="code">500 · application unavailable</div><div class="heart" aria-hidden="true">♡</div><h1 class="title">The page had a little fall.</h1><p class="message">PYQViewer is temporarily unavailable. This page is intentionally minimal and will return to the library as soon as the site is restored.</p><div class="status"><span class="dot"></span><span id="status">Checking status…</span></div><div class="foot credits">Made by Arsh Verma and Sachet Anantwar, with the help of Bina Bhutani.</div></main><script>async function loadLogo(){try{const r=await fetch('/api/status',{cache:'no-store'}).then(x=>x.json());if(r.logo_svg){const img=document.querySelector('.brand img');if(img)img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(r.logo_svg);}}catch(e){}}loadLogo();async function check(){try{const r=await fetch('/api/status',{cache:'no-store'}).then(r=>r.json());document.getElementById('status').textContent=r.maintenance?'Still unavailable':'Restored — returning…';if(!r.maintenance)location.replace('/')}catch(e){document.getElementById('status').textContent='Waiting for the site…'}}check();setInterval(check,3500);</script></body></html>
