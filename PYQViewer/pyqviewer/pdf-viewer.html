<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PYQViewer — PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Lato:wght@400;700;900&family=Manrope:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700;800&display=swap">
<link rel="icon" type="image/svg+xml" href="/assets/pyqviewer-icon.svg">
<link rel="apple-touch-icon" href="/assets/pyqviewer-icon.svg">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg,#05070b);color:var(--text,#fff);font-family:var(--site-font,-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,sans-serif)}body{display:flex;flex-direction:column}.bar{height:58px;flex:0 0 58px;display:flex;align-items:center;gap:.7rem;padding:.55rem 1rem;background:rgba(5,7,15,.94);border-bottom:1px solid rgba(255,255,255,.12);box-shadow:0 10px 35px rgba(0,0,0,.35)}.logo{width:34px;height:34px;object-fit:contain}.title{font-weight:800;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.back{margin-left:auto;color:#dce2f1;text-decoration:none;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:.42rem .75rem;font-size:.72rem;background:rgba(255,255,255,.05)}iframe{width:100%;flex:1;border:0;background:#222} .error{padding:2rem;color:#ffadb8}

:root{--bg:#030408;--text:#f8fafc;--muted:#8994ab;--accent:#8b5cf6;--accent-2:#22d3ee;--panel:#0b101b}
html[data-theme="original"]{--bg:#030408;--text:#f8fafc;--muted:#8994ab;--accent:#8b5cf6;--accent-2:#22d3ee;--panel:rgba(14,17,30,.50)}
html[data-theme="paper"]{--bg:#e8e2d7;--text:#211e1a;--muted:#655e54;--accent:#5943ba;--accent-2:#14738c;--panel:rgba(255,255,255,.83)}
html[data-theme="operator"]{--bg:#0c1110;--text:#effff6;--muted:#a1b7aa;--accent:#73e3a0;--accent-2:#f1c96e;--panel:rgba(26,33,29,.88)}
html[data-theme="glass"]{--bg:#06101b;--text:#f6fcff;--muted:#a3bbcf;--accent:#9c7bff;--accent-2:#45e6ff;--panel:rgba(31,57,84,.33)}
html[data-theme="graphite"]{--bg:#08090b;--text:#f6f7f9;--muted:#a2a8b2;--accent:#f1f4f8;--accent-2:#8f9bab;--panel:rgba(24,28,34,.88)}
html[data-theme="soft-dusk"]{--bg:#241724;--text:#fff8fc;--muted:#d6bacd;--accent:#ffb3dc;--accent-2:#bba2ff;--panel:rgba(69,43,67,.74)}
html[data-theme="porcelain"]{--bg:#f2f5f7;--text:#16232d;--muted:#58707d;--accent:#075985;--accent-2:#0e7490;--panel:rgba(255,255,255,.92)}
html[data-theme="mint"]{--bg:#eaf6ef;--text:#163328;--muted:#55766b;--accent:#147a55;--accent-2:#0e7490;--panel:rgba(255,255,255,.88)}
html[data-theme="solar"]{--bg:#fff3d8;--text:#342615;--muted:#786047;--accent:#b45309;--accent-2:#c026d3;--panel:rgba(255,255,255,.90)}
html[data-theme="liquid-chrome"]{--bg:#11151b;--text:#f8fbff;--muted:#b9c7d7;--accent:#d9f4ff;--accent-2:#a9c7ff;--panel:rgba(235,242,250,.19)}
html[data-theme="aurora"]{--bg:#06100e;--text:#f2fffd;--muted:#a3c6c2;--accent:#5eead4;--accent-2:#8b5cf6;--panel:rgba(13,27,28,.38)}
html[data-theme="plasma"]{--bg:#100713;--text:#fff7ff;--muted:#ddb9e6;--accent:#f472b6;--accent-2:#818cf8;--panel:rgba(38,20,47,.68)}
html[data-theme="ocean-light"]{--bg:#e5f5ff;--text:#123247;--muted:#5a7483;--accent:#0369a1;--accent-2:#0891b2;--panel:rgba(255,255,255,.86)}
html[data-theme="terminal"]{--bg:#050806;--text:#dcffe8;--muted:#8fba9f;--accent:#54f28f;--accent-2:#e5ff67;--panel:rgba(8,20,13,.82)}
html[data-theme="midnight-rose"]{--bg:#0e0811;--text:#fff5fa;--muted:#d0acbc;--accent:#fb7185;--accent-2:#c084fc;--panel:rgba(33,18,37,.72)}
html[data-theme="studio-light"]{--bg:#f7f7fb;--text:#23233d;--muted:#63637a;--accent:#4f46e5;--accent-2:#ea580c;--panel:rgba(255,255,255,.91)}
</style>
</head>
<body>
<header class="bar"><img class="logo" src="/assets/pyqviewer-icon.svg" alt="PYQViewer"><div class="title" id="title">PDF</div><a class="back" href="/">Back to PYQViewer</a></header>
<iframe id="pdf" title="PDF document"></iframe>
<script>
const p=new URLSearchParams(location.search);
const url=p.get('url'); const title=p.get('title')||'PDF';
async function applyAppearance(){try{const r=await fetch('/api/status',{cache:'no-store',credentials:'same-origin'}).then(x=>x.json());const a=r.appearance||{};const themes=['original','paper','operator','glass','graphite','soft-dusk','porcelain','mint','solar','liquid-chrome','aurora','plasma','ocean-light','terminal','midnight-rose','studio-light'];document.documentElement.dataset.theme=themes.includes(a.theme)?a.theme:'original';const fonts={sf:'-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,sans-serif',system:'ui-sans-serif',inter:'Inter,ui-sans-serif',jakarta:'Plus Jakarta Sans,ui-sans-serif',manrope:'Manrope,ui-sans-serif',dm:'DM Sans,ui-sans-serif',outfit:'Outfit,ui-sans-serif',space:'Space Grotesk,ui-sans-serif',ibm:'IBM Plex Sans,ui-sans-serif',source:'Source Sans 3,ui-sans-serif',nunito:'Nunito Sans,ui-sans-serif',work:'Work Sans,ui-sans-serif',poppins:'Poppins,ui-sans-serif',lato:'Lato,ui-sans-serif'};document.documentElement.style.setProperty('--site-font',fonts[a.font]||fonts.sf);if(/^#[0-9a-fA-F]{6}$/.test(a.accent||''))document.documentElement.style.setProperty('--accent',a.accent);if(/^#[0-9a-fA-F]{6}$/.test(a.accent2||''))document.documentElement.style.setProperty('--accent-2',a.accent2);}catch(e){}}
applyAppearance();
document.title='PYQViewer — '+title; document.getElementById('title').textContent=title;
if(url){document.getElementById('pdf').src=url;}else{document.getElementById('pdf').outerHTML='<div class="error">No PDF URL was supplied.</div>';}
</script>
</body>
</html>
