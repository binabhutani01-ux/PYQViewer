<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PYQViewer — PDF</title>
<link rel="icon" type="image/svg+xml" href="/assets/pyqviewer-icon.svg">
<link rel="apple-touch-icon" href="/assets/pyqviewer-icon.svg">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#05070b;color:#fff;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;flex-direction:column}.bar{height:58px;flex:0 0 58px;display:flex;align-items:center;gap:.7rem;padding:.55rem 1rem;background:rgba(5,7,15,.94);border-bottom:1px solid rgba(255,255,255,.12);box-shadow:0 10px 35px rgba(0,0,0,.35)}.logo{width:34px;height:34px;object-fit:contain}.title{font-weight:800;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.back{margin-left:auto;color:#dce2f1;text-decoration:none;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:.42rem .75rem;font-size:.72rem;background:rgba(255,255,255,.05)}iframe{width:100%;flex:1;border:0;background:#222} .error{padding:2rem;color:#ffadb8}
</style>
</head>
<body>
<header class="bar"><img class="logo" src="/assets/pyqviewer-icon.svg" alt="PYQViewer"><div class="title" id="title">PDF</div><a class="back" href="/">Back to PYQViewer</a></header>
<iframe id="pdf" title="PDF document"></iframe>
<script>
const p=new URLSearchParams(location.search);
const url=p.get('url'); const title=p.get('title')||'PDF';
document.title='PYQViewer — '+title; document.getElementById('title').textContent=title;
if(url){document.getElementById('pdf').src=url;}else{document.getElementById('pdf').outerHTML='<div class="error">No PDF URL was supplied.</div>';}
</script>
</body>
</html>
