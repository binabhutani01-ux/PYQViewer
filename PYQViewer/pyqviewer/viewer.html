<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PYQViewer — PDF</title><style>:root{--bg:#030408;--panel:rgba(10,13,22,.74);--line:rgba(255,255,255,.1);--text:#f7f8fb;--muted:#8d96a8;--accent:#8b5cf6}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif}body{display:flex;flex-direction:column;overflow:hidden}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 max(14px,env(safe-area-inset-left)) 0 max(14px,env(safe-area-inset-right));border-bottom:1px solid var(--line);background:rgba(4,6,12,.84);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);gap:1rem}.brand{display:flex;align-items:center;gap:.65rem;font-weight:900;letter-spacing:-.03em;min-width:0}.brand img{width:29px;height:29px;flex:none}.brand-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:flex;gap:.45rem;align-items:center}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:.55rem .8rem;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.045);color:#fff;text-decoration:none;font-size:.72rem;font-weight:800;cursor:pointer;white-space:nowrap}.btn.primary{background:linear-gradient(135deg,var(--accent),#5f68fc);border-color:transparent}.stage{position:relative;flex:1;min-height:0;padding:.8rem}.viewer{width:100%;height:100%;border:1px solid var(--line);border-radius:16px;background:#111;display:block}.empty{display:grid;place-items:center;height:100%;padding:2rem;text-align:center;color:var(--muted)}.meta{position:absolute;left:1.3rem;bottom:1.3rem;max-width:min(560px,calc(100% - 2.6rem));padding:.55rem .7rem;border:1px solid var(--line);border-radius:11px;background:rgba(3,4,9,.78);backdrop-filter:blur(14px);font-size:.68rem;color:#dfe4ef;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:640px){.top{height:auto;min-height:58px;padding:.65rem .7rem}.brand-title{max-width:43vw}.stage{padding:.45rem}.meta{left:.9rem;bottom:.9rem}.btn{padding:.5rem .65rem}}.credit-bar{position:fixed;left:50%;bottom:9px;transform:translateX(-50%);z-index:8;padding:.42rem .68rem;border:1px solid var(--line);border-radius:999px;background:rgba(3,4,9,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#eef2f8;font-size:.58rem;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.3)}@media(max-width:640px){.credit-bar{font-size:.52rem;max-width:calc(100vw - 1rem);overflow:hidden;text-overflow:ellipsis}} </style></head><body><header class="top"><div class="brand"><img src="/logo.svg" alt=""><span class="brand-title" id="doc-title">PYQViewer</span></div><div class="actions"><a class="btn" href="/">Back</a><a class="btn primary" id="download" href="#" download>Download</a></div></header><main class="stage"><div id="frame-wrap" style="width:100%;height:100%"><div class="empty" id="state">Loading PDF…</div></div><div class="meta" id="meta" hidden></div><div class="credit-bar credits">Made by Arsh Verma and Sachet Anantwar, with the help of Bina Bhutani.</div></main><script>async function loadLogo(){try{const r=await fetch('/api/status',{cache:'no-store'}).then(x=>x.json());if(r.logo_svg){const img=document.querySelector('.brand img');if(img)img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(r.logo_svg);}}catch(e){}}loadLogo();async function load(){const id=new URLSearchParams(location.search).get('id');const state=document.getElementById('state'),wrap=document.getElementById('frame-wrap'),title=document.getElementById('doc-title'),dl=document.getElementById('download'),meta=document.getElementById('meta');if(!id){state.textContent='No worksheet was selected.';return;}try{const r=await fetch('/api/worksheets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'get_one',id}),cache:'no-store'}).then(r=>r.json());if(!r.success||!r.worksheet){state.textContent=r.error||'Worksheet not found.';return;}const w=r.worksheet;title.textContent=w.title||'PDF';meta.hidden=false;meta.textContent=(w.teacher_name||'')+(w.created_at?' · '+new Date(w.created_at).toLocaleDateString():'');dl.href=w.file_url;wrap.innerHTML='<iframe class="viewer" title="PDF viewer" src="'+String(w.file_url).replace(/"/g,'%22')+'#view=FitH" loading="eager"></iframe>';}catch(e){state.textContent='Could not load this worksheet.'}}load();</script></body></html>
