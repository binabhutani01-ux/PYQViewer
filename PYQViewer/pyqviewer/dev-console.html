<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PYQViewer — Owner Console</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:#05070f;color:#f8fafc;padding:2rem 1.2rem}
.wrap{width:min(880px,100%);margin:0 auto}
.panel{border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:1.8rem;background:rgba(15,18,32,.7);backdrop-filter:blur(20px)}
.login-wrap{max-width:420px;margin:4rem auto}
h1{font-size:1.3rem;margin-bottom:1rem}
h2{font-size:1rem;margin:0 0 .6rem}
.field{margin-bottom:.9rem}
label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:#78829b;margin-bottom:.4rem}
input,select{width:100%;padding:.75rem .9rem;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.5);color:#fff;outline:none;font-size:.85rem}
button{padding:.7rem 1rem;border-radius:10px;border:0;background:#8b5cf6;color:#fff;font-weight:700;cursor:pointer;font-size:.78rem}
button.block{width:100%;margin-top:.4rem}
button.danger{background:rgba(251,113,133,.85)}
button.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2)}
button.small{padding:.4rem .65rem;font-size:.7rem;margin-right:.3rem;margin-bottom:.3rem}
button:disabled{opacity:.5;cursor:not-allowed}
.error{color:#ffadb8;font-size:.82rem;margin-top:.6rem;display:none}
.row{display:flex;gap:.6rem;flex-wrap:wrap}
.row>*{flex:1;min-width:160px}
table{width:100%;border-collapse:collapse;font-size:.76rem;margin-top:.6rem}
td,th{padding:.45rem .4rem;border-bottom:1px solid rgba(255,255,255,.1);text-align:left;vertical-align:middle}
.section{margin-top:1.8rem;padding-top:1.4rem;border-top:1px solid rgba(255,255,255,.12)}
.pill{display:inline-block;padding:.2rem .5rem;border-radius:6px;font-size:.68rem;font-weight:700}
.on{background:rgba(251,191,36,.2);color:#ffd889}
.off{background:rgba(52,211,153,.15);color:#a7f3d0}
.pending{background:rgba(251,191,36,.18);color:#ffd889}
.approved{background:rgba(52,211,153,.15);color:#a7f3d0}
.head{background:rgba(139,92,246,.22);color:#c9b3ff}
.top-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem}
.muted{color:#78829b;font-size:.78rem}
.toast{position:fixed;top:1rem;right:1rem;background:#141824;border:1px solid rgba(255,255,255,.15);padding:.7rem 1rem;border-radius:10px;font-size:.8rem;z-index:999}
</style>
</head>
<body>
<div class="wrap">
<div id="login-view" class="panel login-wrap">
  <h1>Owner Console</h1>
  <div class="field"><label>Username</label><input id="u" autocomplete="off"></div>
  <div class="field"><label>Password</label><input id="p" type="password"></div>
  <button class="block" onclick="login()">Sign in</button>
  <div class="error" id="err"></div>
</div>

<div id="main-view" style="display:none">
  <div class="panel top-row">
    <div>
      <h1 style="margin-bottom:.2rem">Owner Console</h1>
      <div class="muted">Full control — teachers, subjects, worksheets, and the site itself.</div>
    </div>
    <div class="row" style="max-width:520px">
      <div>Maintenance: <span class="pill" id="maint-pill">—</span></div>
      <button class="secondary small" onclick="toggleMaint(true)">Turn ON</button>
      <button class="secondary small" onclick="toggleMaint(false)">Turn OFF</button>
      <button class="danger small" onclick="purge()">Purge all worksheets</button>
      <button class="secondary small" onclick="logout()">Sign out</button>
    </div>
  </div>

  <div class="panel section" style="margin-top:1.2rem">
    <h2>Teachers (<span id="t-count">0</span>)</h2>
    <table id="t-table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="panel section">
    <h2>Subjects (<span id="s-count">0</span>)</h2>
    <table id="s-table"><thead><tr><th>Name</th><th>Created by</th><th>Status</th><th>Actions</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="panel section">
    <h2>Worksheets (<span id="w-count">0</span>)</h2>
    <table id="w-table"><thead><tr><th>Title</th><th>Teacher</th><th>Uploaded</th><th>Actions</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="panel section">
    <h2>Recent logins</h2>
    <table id="e-table"><thead><tr><th>Teacher</th><th>Location</th><th>Device</th><th>When</th></tr></thead><tbody></tbody></table>
  </div>
</div>
</div>

<script>
async function api(body){ const r = await fetch('/api/owner', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); return r.json(); }
function toast(msg){ const el=document.createElement('div'); el.className='toast'; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),3000); }

async function login(){
  const username=document.getElementById('u').value, password=document.getElementById('p').value;
  const r = await api({action:'login', username, password});
  if(r.success){ document.getElementById('login-view').style.display='none'; document.getElementById('main-view').style.display='block'; loadOverview(); }
  else { document.getElementById('err').textContent = r.error; document.getElementById('err').style.display='block'; }
}
function logout(){ api({action:'logout'}).then(()=>location.reload()); }
async function toggleMaint(on){ const r = await api({action:'toggle_maintenance', on}); paintMaint(r.maintenance); }
function paintMaint(on){ const el=document.getElementById('maint-pill'); el.textContent = on ? 'ON — site offline' : 'OFF'; el.className='pill '+(on?'on':'off'); }
async function purge(){ if(!confirm('Purge ALL worksheets? This cannot be undone.')) return; const r = await api({action:'purge_everything'}); toast(r.success?'Purged.':r.error); loadOverview(); }

async function approveTeacher(id){ const r = await api({action:'approve_teacher', id}); toast(r.success?'Approved.':r.error); loadOverview(); }
async function rejectTeacher(id){ if(!confirm('Reject/remove this teacher account?')) return; const r = await api({action:'reject_teacher', id}); toast(r.success?'Removed.':r.error); loadOverview(); }
async function deleteTeacher(id){ if(!confirm('Permanently delete this teacher account?')) return; const r = await api({action:'delete_teacher', id}); toast(r.success?'Deleted.':r.error); loadOverview(); }
async function setRole(id, role){ const r = await api({action:'set_teacher_role', id, role}); toast(r.success?'Role updated.':r.error); loadOverview(); }
async function forceLogout(id){ if(!confirm('Force-logout this teacher? Their current session will stop working immediately.')) return; const r = await api({action:'force_logout_teacher', id}); toast(r.success?'Teacher logged out.':r.error); loadOverview(); }

async function approveSubject(id){ const r = await api({action:'approve_subject', id}); toast(r.success?'Approved.':r.error); loadOverview(); }
async function deauthSubject(id){ const r = await api({action:'deauthenticate_subject', id}); toast(r.success?'Set back to pending.':r.error); loadOverview(); }
async function deleteSubject(id){ if(!confirm('Delete this subject and its sub-subjects?')) return; const r = await api({action:'delete_subject', id}); toast(r.success?'Deleted.':r.error); loadOverview(); }

async function deleteWorksheet(id){ if(!confirm('Delete this worksheet and its file?')) return; const r = await api({action:'delete_worksheet', id}); toast(r.success?'Deleted.':r.error); loadOverview(); }

let overviewCache = null;

async function loadOverview(){
  const s = await api({action:'status'}); paintMaint(s.maintenance);
  const r = await api({action:'overview'});
  if(!r.success) return;
  overviewCache = r;

  document.getElementById('t-count').textContent = r.teachers.length;
  document.querySelector('#t-table tbody').innerHTML = r.teachers.map(t=>`<tr>
    <td>${t.name}</td><td>${t.email}</td>
    <td><span class="pill ${t.role==='head'?'head':'approved'}">${t.role}</span></td>
    <td><span class="pill ${t.status==='approved'?'approved':'pending'}">${t.status}</span></td>
    <td>
      ${t.status==='pending' ? `<button class="small" onclick="approveTeacher('${t.id}')">Approve</button><button class="small danger" onclick="rejectTeacher('${t.id}')">Reject</button>` : ''}
      ${t.status==='approved' ? `<button class="small secondary" onclick="forceLogout('${t.id}')">Force logout</button>` : ''}
      ${t.status==='approved' && t.role!=='head' ? `<button class="small secondary" onclick="setRole('${t.id}','head')">Make head</button>` : ''}
      ${t.status==='approved' && t.role==='head' ? `<button class="small secondary" onclick="setRole('${t.id}','teacher')">Demote</button>` : ''}
      <button class="small danger" onclick="deleteTeacher('${t.id}')">Delete</button>
    </td></tr>`).join('') || '<tr><td colspan="5">No teachers yet.</td></tr>';

  document.getElementById('s-count').textContent = r.subjects.length;
  document.querySelector('#s-table tbody').innerHTML = r.subjects.map(s=>`<tr>
    <td>${s.name}</td><td>${s.created_by_name||''}</td>
    <td><span class="pill ${s.status==='approved'?'approved':'pending'}">${s.status}</span></td>
    <td>
      ${s.status==='pending' ? `<button class="small" onclick="approveSubject('${s.id}')">Approve</button>` : `<button class="small secondary" onclick="deauthSubject('${s.id}')">Deauthenticate</button>`}
      <button class="small danger" onclick="deleteSubject('${s.id}')">Delete</button>
    </td></tr>`).join('') || '<tr><td colspan="4">No subjects yet.</td></tr>';

  document.getElementById('w-count').textContent = r.worksheets.length;
  document.querySelector('#w-table tbody').innerHTML = r.worksheets.map(w=>`<tr>
    <td>${w.title}</td><td>${w.teacher_name||''}</td><td>${new Date(w.created_at).toLocaleString()}</td>
    <td><a href="${w.file_url}" target="_blank" style="color:#a7f3d0">Open</a> &nbsp;
      <button class="small danger" onclick="deleteWorksheet('${w.id}')">Delete</button></td></tr>`).join('') || '<tr><td colspan="4">No worksheets yet.</td></tr>';

  document.querySelector('#e-table tbody').innerHTML = r.events.slice(0,30).map(e=>`<tr><td>${e.teacher_name||''}</td><td>${(e.city||'')+(e.country?', '+e.country:'')}</td><td>${e.device||''}</td><td>${new Date(e.created_at).toLocaleString()}</td></tr>`).join('');
}
document.getElementById('p').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
</script>
</body>
</html>
